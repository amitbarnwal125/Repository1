name: probe-sources
on:
  push:
    branches: [bollywood-music-app]
    paths: ['tools/**', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_commons.py > probe.txt 2>&1 || true
      - name: Publish probe output to ci-logs branch
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          cp probe.txt /tmp/probe.txt
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . >/dev/null
          (git checkout origin/ci-logs -- . 2>/dev/null) || true
          cp /tmp/probe.txt probe.txt
          git add probe.txt && git commit -m "probe $GITHUB_SHA" && git push -f origin HEAD:ci-logs
