name: probe-sources
on:
  push:
    branches: [bollywood-music-app]
    paths: ['tools/probe*.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 tools/probe2.py > out/probe.txt 2>&1 || true
      - run: tools/publish_logs.sh out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
